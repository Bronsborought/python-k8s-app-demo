name: Cloud CD

on:
  push:
    branches:
      - feature/cloud-cicd
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: python-k8s-app-demo-dt26
  REGION: europe-central2
  AR_REPOSITORY: python-k8s-app
  IMAGE_NAME: my-app
  GKE_CLUSTER: python-k8s-app
  GKE_NAMESPACE: production
  WIF_PROVIDER: projects/518693990652/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SERVICE_ACCOUNT: github-actions-deploy@python-k8s-app-demo-dt26.iam.gserviceaccount.com

jobs:
  verify-gcp-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Show active Google Cloud identity
        run: |
          gcloud auth list \
            --filter=status:ACTIVE \
            --format="value(account)"

          gcloud config get-value project

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          docker build \
            --tag "$IMAGE" \
            .

          docker push "$IMAGE"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Check GKE access
        run: |
          kubectl get deployment my-app \
            --namespace="${GKE_NAMESPACE}"

      - name: Deploy image to GKE production
        if: github.event_name == 'workflow_dispatch'
        run: |
          kubectl set image deployment/my-app \
            my-app="$IMAGE" \
            --namespace="${GKE_NAMESPACE}"

          kubectl rollout status deployment/my-app \
            --namespace="${GKE_NAMESPACE}" \
            --timeout=5m

          kubectl get deployment my-app \
            --namespace="${GKE_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
