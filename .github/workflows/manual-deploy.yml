name: Cloud Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to rollback to (full commit SHA)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: python-k8s-app-demo-dt26
  REGION: europe-central2
  AR_REPOSITORY: python-k8s-app
  IMAGE_NAME: my-app
  GKE_CLUSTER: python-k8s-app
  PRODUCTION_NAMESPACE: production
  WIF_PROVIDER: projects/518693990652/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SERVICE_ACCOUNT: github-actions-deploy@python-k8s-app-demo-dt26.iam.gserviceaccount.com
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  validate-image:
    runs-on: ubuntu-latest

    steps:
      - name: Validate image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a full 40-character commit SHA."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Validate rollback image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"

          gcloud artifacts docker images describe "$IMAGE" > /dev/null

          echo "Rollback image exists: $IMAGE"

  rollback-production:
    needs: validate-image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Rollback production
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"

          kubectl set image deployment/my-app \
            my-app="$IMAGE" \
            --namespace="${PRODUCTION_NAMESPACE}"

          kubectl annotate deployment my-app \
            --namespace="${PRODUCTION_NAMESPACE}" \
            kubernetes.io/change-cause="Rollback to ${IMAGE_TAG}" \
            --overwrite

          kubectl rollout status deployment/my-app \
            --namespace="${PRODUCTION_NAMESPACE}" \
            --timeout=5m

      - name: Smoke test production
        run: |
          curl -fsS https://app.tarakanovds.lol/health
          echo

          curl -fsS https://app.tarakanovds.lol/ready
          echo

      - name: Show deployed image
        run: |
          kubectl get deployment my-app \
            --namespace="${PRODUCTION_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
