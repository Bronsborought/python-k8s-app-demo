name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t bronsboro/my-app:latest \
            -t bronsboro/my-app:${{ github.sha }} \
            .

      - name: Push latest image
        run: |
          docker push bronsboro/my-app:latest

      - name: Push commit image
        run: |
          docker push bronsboro/my-app:${{ github.sha }}
