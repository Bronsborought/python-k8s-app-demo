name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run application tests
        run: |
          python -m pytest -v


  build-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t bronsboro/my-app:latest \
            -t bronsboro/my-app:${{ github.sha }} \
            .

      - name: Push latest image
        run: |
          docker push bronsboro/my-app:latest

      - name: Push commit image
        run: |
          docker push bronsboro/my-app:${{ github.sha }}


  deploy-staging:
    if: github.event_name == 'push'
    needs: build-push
    runs-on: self-hosted
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          sed "s|image: bronsboro/my-app:latest|image: bronsboro/my-app:${{ github.sha }}|" \
            k8s/staging/deployment.yml | kubectl apply -f -

      - name: Add staging deployment change cause
        run: |
          kubectl annotate deployment my-app \
            -n staging \
            kubernetes.io/change-cause="Deploy ${{ github.sha }}" \
            --overwrite

      - name: Wait for staging rollout
        run: |
          kubectl rollout status deployment/my-app \
            -n staging \
            --timeout=120s

      - name: Smoke test staging
        run: |
          curl -fsS \
            --connect-timeout 3 \
            --max-time 10 \
            http://staging.my-app.local/health

          curl -fsS \
            --connect-timeout 3 \
            --max-time 10 \
            http://staging.my-app.local/ready

      - name: Show staging image
        run: |
          kubectl get deployment my-app \
            -n staging \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo


  deploy-production:
    if: github.event_name == 'push'
    needs: deploy-staging
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          sed "s|image: bronsboro/my-app:latest|image: bronsboro/my-app:${{ github.sha }}|" \
            k8s/production/deployment.yml | kubectl apply -f -

      - name: Add production deployment change cause
        run: |
          kubectl annotate deployment my-app \
            -n production \
            kubernetes.io/change-cause="Deploy ${{ github.sha }}" \
            --overwrite

      - name: Wait for production rollout
        run: |
          kubectl rollout status deployment/my-app \
            -n production \
            --timeout=120s

      - name: Show production image
        run: |
          kubectl get deployment my-app \
            -n production \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo
