name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t bronsboro/my-app:latest \
            -t bronsboro/my-app:${{ github.sha }} \
            .

      - name: Push latest image
        run: |
          docker push bronsboro/my-app:latest

      - name: Push commit image
        run: |
          docker push bronsboro/my-app:${{ github.sha }}

      - name: Update Kubernetes deployment
        run: |
          kubectl set image \
            deployment/my-app \
            my-app=bronsboro/my-app:${{ github.sha }}

      - name: Wait for Kubernetes rollout
        run: |
          kubectl rollout status deployment/my-app --timeout=120s

      - name: Show deployed image
        run: |
          kubectl get deployment my-app \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo
