apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: my-app

  template:
    metadata:
      labels:
        app: my-app

    spec:
      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: my-app
          image: bronsboro/my-app:latest

          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: my-app-config
                  key: APP_MESSAGE

            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: my-app-secret
                  key: APP_SECRET

          readinessProbe:
            httpGet:
              path: /
              port: 8000

          livenessProbe:
            httpGet:
              path: /
              port: 8000
