apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring

spec:
  selector:
    matchLabels:
      app: fluent-bit

  template:
    metadata:
      labels:
        app: fluent-bit

    spec:
      serviceAccountName: fluent-bit

      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.2

          args:
            - -c
            - /fluent-bit/etc/fluent-bit.conf

          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true

            - name: varlog
              mountPath: /var/log
              readOnly: true

            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true

            - name: state
              mountPath: /fluent-bit/state

      volumes:
        - name: config
          configMap:
            name: fluent-bit-config

        - name: varlog
          hostPath:
            path: /var/log
            type: Directory

        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory

        - name: state
          emptyDir: {}
