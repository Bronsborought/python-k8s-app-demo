apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring

data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: application
        folder: ""
        type: file
        disableDeletion: false
        editable: true

        options:
          path: /var/lib/grafana/dashboards
