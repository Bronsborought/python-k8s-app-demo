apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "staging"
        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - staging

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: my-app-service

      - job_name: "production"
        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - production

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: my-app-service