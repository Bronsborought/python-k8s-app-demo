apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring

data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/my-app-*.log
        Tag               kube.*
        Multiline.Parser  docker, cri
        DB                /fluent-bit/state/flb_kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    [FILTER]
        Name             kubernetes
        Match            kube.*
        Kube_Tag_Prefix  kube.var.log.containers.
        Merge_Log        On
        Keep_Log         Off

    [OUTPUT]
        Name         loki
        Match        kube.*
        Host         loki
        Port         3100
        Labels       job=python-k8s-app,namespace=$kubernetes['namespace_name']
        Line_Format  json
        Retry_Limit  False
